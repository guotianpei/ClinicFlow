name: M01 tenant isolation

on:
  pull_request:
    paths:
      - "haloflow/**"
      - ".github/workflows/m01.yml"
  push:
    branches:
      - main
      - feature/m01-tenant-context

jobs:
  verify-m01:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: haloflow_test_m01
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haloflow_test_m01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: haloflow

    env:
      HALOFLOW_TEST_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/haloflow_test_m01
      # L-1W W2: the postgres:17 service above is a fresh container per run, so the
      # L-1W harness may create its token-named synthetic LOGIN roles here
      # (Codex final disposition pin 4; tests/platform/l1w_db_support.py).
      HALOFLOW_TEST_DISPOSABLE_CLUSTER: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: haloflow/locks/linux-x86_64-cp312*.txt
      # One verified install stage, shared with local verification. It creates a
      # fresh virtualenv, installs from the hash-pinned locks it snapshots into the
      # evidence, and checks every premise: approved target, lock parse, coverage in
      # both directions, installed artifact hashes against the lock, pip check,
      # declared requirements and the dev extra against the lock, editable-install
      # source path. It runs no gates; the gates below are CI's.
      - run: >-
          scripts/verified-install.sh
          --python python3.12
          --target linux-x86_64-cp312
          --project .
          --locks locks
          --evidence "$RUNNER_TEMP/verify-evidence"
          --envdir "$RUNNER_TEMP/verify-env"
          --source-revision "$GITHUB_SHA"
      - run: echo "VENV=$(cat "$RUNNER_TEMP/verify-evidence/envdir.txt")" >> "$GITHUB_ENV"
      # The three gate steps. Each `run:` stays on one line and is preceded by
      # exactly one marker comment: scripts/gate-reachability.sh resolves the
      # commands from these markers and fails closed if one is missing,
      # duplicated or does not start with the expected tool (CP2-2a I-9, 2A-C10).
      # gate-reachability: lint
      - run: $VENV/bin/ruff check src/haloflow/m01 src/haloflow/m02 src/haloflow/m05 src/haloflow/platform src/haloflow/composition.py src/haloflow/startup.py tests/conftest.py tests/m01 tests/m02 tests/m05 tests/platform alembic
      # gate-reachability: type
      - run: $VENV/bin/mypy src/haloflow/m01 src/haloflow/m02 src/haloflow/m05 src/haloflow/platform src/haloflow/composition.py src/haloflow/startup.py
      # The FULL set. No -m "not postgres" here: the service above exists for these.
      # gate-reachability: test
      - run: $VENV/bin/pytest tests/m01 tests/m02 tests/m05 tests/platform -q -rA
        id: pytest
        # The JUnit report and the session record (ci/ci_pytest_session.py: pytest's
        # own final exit status and collected count) are requested through this
        # step's environment only, so the gated one-line command above (resolved by
        # gate-reachability) is unchanged and the later reachability specimen runs
        # cannot overwrite either file. ci/ holds only the plugin and the manifest.
        env:
          PYTHONPATH: ${{ github.workspace }}/haloflow/ci
          CI_PYTEST_SESSION_FILE: ${{ runner.temp }}/verify-evidence/pytest/session.json
          PYTEST_ADDOPTS: >-
            -p ci_pytest_session
            -o junit_family=xunit1
            --junitxml=${{ runner.temp }}/verify-evidence/pytest/junit.xml
      # Diagnostic only: complete node classification saved with the evidence, and
      # notices (check-run annotations) with status, counts and the non-passing
      # list. Never changes the job outcome; the gate is pytest's exit status above.
      - if: ${{ !cancelled() }}
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 -I scripts/ci_test_report.py
          --junit "$RUNNER_TEMP/verify-evidence/pytest/junit.xml"
          --session "$RUNNER_TEMP/verify-evidence/pytest/session.json"
          --manifest ci/expected-red.json
          --out "$RUNNER_TEMP/verify-evidence/pytest/classification.json"
          --pytest-outcome "$PYTEST_OUTCOME"
          --source-sha "$GITHUB_SHA"
          --head-sha "$HEAD_SHA"
      # UC1 B5 closeout trace controls (Codex 24f9221d R5: measured in CI). They
      # run even when pytest failed, so a red tranche measures them too.
      - if: ${{ !cancelled() }}
        run: $VENV/bin/pytest scripts/test_uc1_trace.py scripts/test_l1w_trace.py -q -rA -p no:cacheprovider
      # CP2-2a gate reachability (2A-C07..C11, F03): a separate harness invocation
      # in this job, executing the resolved gate commands against run-time
      # specimens. Nothing is committed; its log is uploaded with the evidence.
      # The self-test runs the C10/C11 negative controls first.
      - run: >-
          scripts/gate-reachability.sh --selftest
          --venv "$VENV"
          --workflow ../.github/workflows/m01.yml
          --evidence "$RUNNER_TEMP/verify-evidence/gate-reachability-selftest"
      - run: >-
          scripts/gate-reachability.sh
          --venv "$VENV"
          --workflow ../.github/workflows/m01.yml
          --evidence "$RUNNER_TEMP/verify-evidence/gate-reachability"
      # UC1 part A mutation controls for haloflow.m02.observation (Codex
      # 20261031T152545Z): the service test module must pass on the unmodified
      # source and fail on each single-change mutant; the source is restored and its
      # SHA-256 re-checked. Results go to the evidence and to one notice.
      # The checker's own controls first (F-MUT1): synthetic evidence, no database.
      - run: $VENV/bin/pytest scripts/test_m02_observation_mutants.py -q -p no:cacheprovider
      - run: >-
          python3 -I scripts/m02_observation_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/mutation"
      # UC1 part B, B2 (Codex 20261101T003810Z): four named mutants of
      # m05_create_item, judged by the part A checker's rules (predeclared kill
      # sets, structured evidence, restored source). Its static controls first.
      - run: $VENV/bin/pytest scripts/test_m05_create_mutants.py -q -p no:cacheprovider
      - run: >-
          python3 -I scripts/m05_create_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/m05-mutation"
      # UC1 part B, B4 (package v2 7): nine named mutants of the resolve SQL and
      # service, in four groups, judged by the same checker. Static controls first.
      - run: $VENV/bin/pytest scripts/test_m05_resolve_mutants.py -q -p no:cacheprovider
      - run: >-
          python3 -I scripts/m05_resolve_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/m05-resolve-mutation"
      # UC1 part B, B5 (package v2 + v2r1): ten predeclared SU mutants of the
      # trusted startup and the activation validator, in four groups, judged by
      # the same checker. Static controls first.
      - run: $VENV/bin/pytest scripts/test_b5_startup_mutants.py -q -p no:cacheprovider
      - run: >-
          python3 -I scripts/b5_startup_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/b5-startup-mutation"
      # L-1W W1: 28 predeclared security mutants of the verifier and the key-set
      # client, two groups, judged by the same checker. Static controls first.
      - run: $VENV/bin/pytest scripts/test_l1w_w1_mutants.py -q -p no:cacheprovider
      - run: >-
          python3 -I scripts/l1w_w1_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/l1w-w1-mutation"
      # L-1W W2: 35 predeclared security mutants of alembic 008, each run on its own
      # fresh database in this disposable cluster, judged by the same checker.
      - run: $VENV/bin/pytest scripts/test_l1w_w2_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/l1w_w2_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/l1w-w2-mutation"
      # L-1W W3a: targeted mutants of t029/t032 and the M05 v2 actions (guard before
      # membership, membership before item, role authority), fresh database per run.
      - run: $VENV/bin/pytest scripts/test_l1w_w3a_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/l1w_w3a_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/l1w-w3a-mutation"
      # L-1W W3b: 18 targeted mutants (t034 first member, the acl_closure_v1 kind,
      # t029 replay integrity, and v2 equivalents of the historical v1 rows), five
      # groups, fresh database per run, judged by the same checker.
      - run: $VENV/bin/pytest scripts/test_l1w_w3b_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/l1w_w3b_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/l1w-w3b-mutation"
      # L-1W W4a: 15 predeclared mutants of the platform admission adapter (PG17
      # rows), the app lifespan/mapping and the outermost gate (unit rows).
      - run: $VENV/bin/pytest scripts/test_l1w_w4a_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/l1w_w4a_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/l1w-w4a-mutation"
      # L-1W W4b: 17 predeclared mutants in three unit groups (w4b_capabilities:
      # haloflow.platform.capabilities; w4b_routes: haloflow.platform.routes and the
      # closed status map in haloflow.platform.http), kill sets in
      # scripts/l1w_w4b_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_l1w_w4b_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/l1w_w4b_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/l1w-w4b-mutation"
      # L-1S S-A: 17 predeclared mutants (M1..M17, red package v1/v1r1/v1r2) in four
      # PostgreSQL 17 groups (haloflow.m05.intake_units against the directory/dispatch,
      # inbound and timer/interleaving modules; haloflow.m05.intake against the service
      # module), kill sets in scripts/sa_intake_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_sa_intake_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/sa_intake_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/sa-intake-mutation"
      # L-1S package S-B due-window mutation controls M1-M11: four groups (t045 unit SQL
      # against the selector module; the runner against the runner, cancellation and
      # static modules), kill sets in scripts/sb_due_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_sb_due_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/sb_due_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/sb-due-mutation"
      # L-1S package S-C activation-switch mutation controls SC1-SC13: four groups (the
      # handle against the static module; the gateway, startup and t046 unit against the
      # PostgreSQL / static modules), kill sets in scripts/sc_activation_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_sc_activation_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/sc_activation_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/sc-activation-mutation"
      # L-1S package S-H H1 send/recovery mutation controls M1-M10: three groups (units and
      # statements against the PostgreSQL module, the worker against the unit module),
      # kill sets in scripts/sh_h1_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_sh_h1_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/sh_h1_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/sh-h1-mutation"
      # L-1S package S-H H2 scheduling / send-ticket mutation controls M1-M16 (M7 via the
      # P35 row-lock fixture): three groups (units and statements against the PostgreSQL
      # module, the worker against the unit module), kill sets in
      # scripts/sh_h2_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_sh_h2_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/sh_h2_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/sh-h2-mutation"
      # L-1S package S-H H3 reminder-scheduler / t075 mutation controls X1-X19: three groups
      # (scheduler against the unit module, X1p-X3p and the t075 SQL against the PostgreSQL
      # module), kill sets in scripts/sh_h3_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_sh_h3_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/sh_h3_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/sh-h3-mutation"
      # L-1S package S-I write-back mutation controls E1-E4, W1-W8, S1-S15, S17, V1-V11: five
      # groups (simulated EHR and workers against the unit module, the unit bodies against
      # the SQL-path module, the service and its SQL against the service module), kill
      # sets in scripts/si_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_si_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/si_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/si-mutation"
      # L-1S package S-J write-back scheduler mutation controls J-M1..J-M11 (J-M6a/b): three
      # groups (the scheduler against the unit module and against the combined-lifespan
      # PostgreSQL module; the TEST-ONLY harness orchestration against the PostgreSQL
      # module), kill sets in scripts/sj_mutant_kills.json.
      - run: $VENV/bin/pytest scripts/test_sj_mutants.py -q -p no:cacheprovider
      - run: >-
          $VENV/bin/python -I scripts/sj_mutants.py
          --pytest "$VENV/bin/pytest"
          --evidence "$RUNNER_TEMP/verify-evidence/sj-mutation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-evidence
