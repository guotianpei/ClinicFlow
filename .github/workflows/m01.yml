name: M01 tenant isolation

on:
  pull_request:
    paths:
      - "haloflow/alembic/**"
      - "haloflow/src/haloflow/m01/**"
      - "haloflow/tests/m01/**"
      - "haloflow/pyproject.toml"
      - ".github/workflows/m01.yml"
  push:
    branches:
      - main
      - feature/m01-tenant-context

jobs:
  verify-m01:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: haloflow_test_m01
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haloflow_test_m01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: haloflow

    env:
      HALOFLOW_TEST_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/haloflow_test_m01

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: haloflow/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/haloflow/m01 tests/m01 alembic
      - run: mypy src/haloflow/m01
      - run: pytest tests/m01 -q
